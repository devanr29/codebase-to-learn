[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codemap"
version = "0.1.0"
description = "Change explainer for AI-assisted codebases — a git-triggered semantic diff over a symbol-level graph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
    "pathspec>=0.12",
    "networkx>=3.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
codemap = "codemap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["codemap"]

[tool.hatch.build.targets.wheel.force-include]
"codemap/schema.sql" = "codemap/schema.sql"
"codemap/languages/queries" = "codemap/languages/queries"
"codemap/hooks" = "codemap/hooks"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
