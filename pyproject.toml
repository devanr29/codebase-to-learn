[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codemap"
version = "0.1.0"
description = "Change explainer for AI-assisted codebases — a git-triggered semantic diff over a symbol-level graph"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Devan Ramadhana", email = "devanr2911@gmail.com" },
]
keywords = ["git", "code-graph", "semantic-diff", "tree-sitter", "code-review", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
    "pathspec>=0.12",
    "networkx>=3.0",
]

# NOTE: distribution name kept as "codemap" — install is GitHub-only for now
# (see docs/install.md), so there's no PyPI namespace to collide with. If this
# is ever published to PyPI, check first: "codemap" is a common enough name
# that it may already be taken, in which case rename the distribution (e.g.
# "codemap-explorer") while keeping the `codemap` console command below.

[project.urls]
Homepage = "https://github.com/devanr29/codebase-to-learn"
Repository = "https://github.com/devanr29/codebase-to-learn"
Issues = "https://github.com/devanr29/codebase-to-learn/issues"
Documentation = "https://github.com/devanr29/codebase-to-learn/tree/main/docs"

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
codemap = "codemap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["codemap"]
# The data files under codemap/ (schema.sql, languages/queries/*.scm,
# hooks/post-commit, site/assets/*) are git-tracked inside the package, so
# hatchling ships them via `packages` above. A force-include table listing
# those same paths double-adds them and the wheel build aborts on the
# collision (`A second file is being added ... at the same path`). Editable
# installs never hit it, which is why -e installs and CI stayed green.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
